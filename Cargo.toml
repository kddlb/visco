[workspace]
resolver = "3"
members = ["crates/visco-core", "crates/visco-jpeg", "crates/visco-flac", "crates/visco-app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
visco-core = { path = "crates/visco-core" }
visco-jpeg = { path = "crates/visco-jpeg" }
visco-flac = { path = "crates/visco-flac" }
hound = "3.5"
claxon = "0.4"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
gpui-kit = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
zune-jpeg = "0.4"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.visco-jpeg]
opt-level = 3

[profile.dev.package.visco-flac]
opt-level = 3
